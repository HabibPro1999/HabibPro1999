<svg xmlns="http://www.w3.org/2000/svg" width="860" height="286" viewBox="0 0 860 286" role="img" aria-label="Diagram of the loop behind every feature, in five steps. 01 Grill: Question the request until nothing is ambiguous. 02 Spec: PRD with testable EARS acceptance criteria. 03 Build: Parallel agent panes, split along the code's natural seams. 04 Review: Effort sized to the diff, plus a second model as a gate. 05 Ship: Green by exit code, never by a model's opinion. After review, a fix loop returns to build until the gate is green. A human signs off at steps 01 and 05. Tools I wrote for this loop: assay (public) · cmax · mate · fob · figma-fidelity." fill="none"><title>Diagram of the loop behind every feature, in five steps. 01 Grill: Question the request until nothing is ambiguous. 02 Spec: PRD with testable EARS acceptance criteria. 03 Build: Parallel agent panes, split along the code's natural seams. 04 Review: Effort sized to the diff, plus a second model as a gate. 05 Ship: Green by exit code, never by a model's opinion. After review, a fix loop returns to build until the gate is green. A human signs off at steps 01 and 05. Tools I wrote for this loop: assay (public) · cmax · mate · fob · figma-fidelity.</title><style>@font-face{font-family:M4;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:M5;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:G4;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:G6;src:url(data:font/woff2;base64,) format('woff2')}.tok{animation:tok 3.6s cubic-bezier(.45,0,.55,1) .5s both}@keyframes tok{from{transform:translateX(-643.2px)}}.loop{stroke-dasharray:4 5;animation:loop 1.2s linear 3}@keyframes loop{to{stroke-dashoffset:-18}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="859" height="285" rx="16" fill="#11100f" stroke="#272624"/><text x="28" y="32" font-family="M5" font-size="10.5" fill="#a3a19a" letter-spacing="1.1">THE LOOP BEHIND EVERY FEATURE</text><text x="832" y="32" font-family="M4" font-size="10.5" fill="#8a877f" text-anchor="end" letter-spacing="1.1">A HUMAN SIGNS OFF AT 01 AND 05</text><path d="M0 50L860 50" stroke="#272624" stroke-width="1"/><path d="M76.4 112L683.6 112" stroke="#3b3935" stroke-width="1.5"/><path class="loop" d="M540.8 92C520.8 60 400 60 386 90" stroke="#ff5c21" stroke-width="1.5"/><path d="M381 83L385 91L393 87" stroke="#ff5c21" stroke-width="1.5"/><text x="460.4" y="62" font-family="M4" font-size="9.5" fill="#ff5c21" text-anchor="middle">fix, re-review, re-gate</text><circle cx="58.4" cy="112" r="17" fill="#11100f" stroke="#edebe5" stroke-width="1.5"/><text x="58.4" y="116" font-family="M5" font-size="11" fill="#edebe5" text-anchor="middle">01</text><text x="58.4" y="84" font-family="M4" font-size="8.5" fill="#8a877f" text-anchor="middle" letter-spacing="1">HUMAN</text><text x="41.4" y="162" font-family="G6" font-size="17" fill="#edebe5">Grill</text><text x="41.4" y="184" font-family="G4" font-size="12.75" fill="#a3a19a">Question the request</text><text x="41.4" y="202" font-family="G4" font-size="12.75" fill="#a3a19a">until nothing is</text><text x="41.4" y="220" font-family="G4" font-size="12.75" fill="#a3a19a">ambiguous.</text><circle cx="219.2" cy="112" r="17" fill="#11100f" stroke="#3b3935" stroke-width="1.5"/><text x="219.2" y="116" font-family="M5" font-size="11" fill="#edebe5" text-anchor="middle">02</text><text x="202.2" y="162" font-family="G6" font-size="17" fill="#edebe5">Spec</text><text x="202.2" y="184" font-family="G4" font-size="12.75" fill="#a3a19a">PRD with testable</text><text x="202.2" y="202" font-family="G4" font-size="12.75" fill="#a3a19a">EARS acceptance</text><text x="202.2" y="220" font-family="G4" font-size="12.75" fill="#a3a19a">criteria.</text><circle cx="380" cy="112" r="17" fill="#11100f" stroke="#3b3935" stroke-width="1.5"/><text x="380" y="116" font-family="M5" font-size="11" fill="#edebe5" text-anchor="middle">03</text><text x="363" y="162" font-family="G6" font-size="17" fill="#edebe5">Build</text><text x="363" y="184" font-family="G4" font-size="12.75" fill="#a3a19a">Parallel agent panes,</text><text x="363" y="202" font-family="G4" font-size="12.75" fill="#a3a19a">split along the code's</text><text x="363" y="220" font-family="G4" font-size="12.75" fill="#a3a19a">natural seams.</text><circle cx="540.8" cy="112" r="17" fill="#11100f" stroke="#3b3935" stroke-width="1.5"/><text x="540.8" y="116" font-family="M5" font-size="11" fill="#edebe5" text-anchor="middle">04</text><text x="523.8" y="162" font-family="G6" font-size="17" fill="#edebe5">Review</text><text x="523.8" y="184" font-family="G4" font-size="12.75" fill="#a3a19a">Effort sized to the</text><text x="523.8" y="202" font-family="G4" font-size="12.75" fill="#a3a19a">diff, plus a second</text><text x="523.8" y="220" font-family="G4" font-size="12.75" fill="#a3a19a">model as a gate.</text><circle cx="701.6" cy="112" r="17" fill="#11100f" stroke="#edebe5" stroke-width="1.5"/><text x="701.6" y="116" font-family="M5" font-size="11" fill="#edebe5" text-anchor="middle">05</text><text x="701.6" y="84" font-family="M4" font-size="8.5" fill="#8a877f" text-anchor="middle" letter-spacing="1">HUMAN</text><text x="684.6" y="162" font-family="G6" font-size="17" fill="#edebe5">Ship</text><text x="684.6" y="184" font-family="G4" font-size="12.75" fill="#a3a19a">Green by exit code,</text><text x="684.6" y="202" font-family="G4" font-size="12.75" fill="#a3a19a">never by a model's</text><text x="684.6" y="220" font-family="G4" font-size="12.75" fill="#a3a19a">opinion.</text><circle class="tok" cx="701.6" cy="95" r="4" fill="#ff5c21"/><path d="M0 240L860 240" stroke="#272624" stroke-width="1"/><text x="28" y="267" font-family="M4" font-size="10.5" fill="#a3a19a" letter-spacing="0.4">Tools I wrote for this loop: assay (public) · cmax · mate · fob · figma-fidelity</text></svg>
