name: Refresh profile

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/profile.json", "scripts/**", "fonts/**"]

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.63.0 brotli==1.2.0
      - run: python scripts/build.py --fetch
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit changes
        run: |
          git add README.md assets data/stats.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile stats"
          git push
